<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System 3D</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #000000 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        color: #fff;
      }

      .container {
        position: relative;
        height: 100%;
        width: 100%;
      }

      h1 {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 2rem;
        font-weight: bold;
        color: #ffffff;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        z-index: 2;
        background-color: rgba(0, 0, 0, 0.3);
        padding: 0.5rem 1rem;
        border-radius: 8px;
      }

      .created-by {
        position: absolute;
        bottom: 20px;
        right: 20px;
        font-size: 1rem;
        color: #ffffff;
        z-index: 2;
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.6);
      }

      .created-by a {
        color: #ffcc00;
        text-decoration: none;
      }

      .created-by a:hover {
        text-decoration: underline;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #info-card {
        position: absolute;
        top: 80px;
        left: 20px;
        background-color: rgba(0, 0, 0, 0.7);
        padding: 1rem;
        border-radius: 8px;
        max-width: 220px;
        z-index: 2;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      }

      #info-card h2 {
        font-size: 1.2rem;
        margin-bottom: 0.5rem;
      }

      #info-card p {
        margin: 0.3rem 0;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Solar System 3D Model</h1>
      <div id="info-card">
        <h2>Click a planet</h2>
        <p>to see its info</p>
      </div>
      <div class="created-by">
        Created with ❤️ by <a href="#">Arsh</a>
      </div>
      <script type="module" src="./main.js"></script>
    </div>
  </body>
</html>
